<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/10199/10199746.png" type="image/x-icon">
</head>

<body>
    <!-- Subtle Background Pattern -->
    <div class="bg-overlay"></div>

    <main class="container">
        <header class="header">
            <h1>Tic Tac Toe</h1>
        </header>

        <!-- Player Setup Card -->
        <div class="card names" id="setup-card">
            <h2>Enter Player Names</h2>

            <div class="input-group">
                <label for="player1">Player 1 (X)</label>
                <input type="text" placeholder="Enter Player 1 Name" class="namebox" id="player1" name="player1" maxlength="15">
            </div>

            <div class="input-group">
                <label for="player2">Player 2 (O)</label>
                <input type="text" placeholder="Enter Player 2 Name" class="namebox" id="player2" name="player2" maxlength="15">
            </div>

            <button id="start-btn" class="btn primary-btn">Start Game</button>
        </div>

        <!-- Active Game Area -->
        <div id="game-area" class="game-area" style="display: none;">
            <!-- Scoreboard / Player Pills -->
            <div class="scoreboard">
                <div class="score-pill p1-pill active-turn" id="p1-card">
                    <span class="player-symbol x-text">X</span>
                    <span class="player-label" id="p1">Player 1</span>
                    <strong class="score-count" id="score-x">0</strong>
                </div>
                <div class="score-pill draw-pill">
                    <span class="player-label">Draws</span>
                    <strong class="score-count" id="score-draw">0</strong>
                </div>
                <div class="score-pill p2-pill" id="p2-card">
                    <span class="player-symbol o-text">O</span>
                    <span class="player-label" id="p2">Player 2</span>
                    <strong class="score-count" id="score-o">0</strong>
                </div>
            </div>

            <!-- Turn / Winner Status Banner -->
            <div class="popup" id="status-popup">
                <h4 class="turn" id="turn-text">Player 1 (X)'s Turn</h4>
            </div>

            <!-- 3x3 Board -->
            <div id="box-btn" class="board" data-turn="X">
                <button class="cell box1" aria-label="Cell 1"></button>
                <button class="cell box2" aria-label="Cell 2"></button>
                <button class="cell box3" aria-label="Cell 3"></button>
                <button class="cell box4" aria-label="Cell 4"></button>
                <button class="cell box5" aria-label="Cell 5"></button>
                <button class="cell box6" aria-label="Cell 6"></button>
                <button class="cell box7" aria-label="Cell 7"></button>
                <button class="cell box8" aria-label="Cell 8"></button>
                <button class="cell box9" aria-label="Cell 9"></button>
            </div>

            <!-- Action Controls -->
            <div class="action-buttons">
                <button id="restart-btn" class="btn primary-btn">Play Again</button>
                <button id="change-names-btn" class="btn secondary-btn">Change Players</button>
            </div>
        </div>
    </main>

    <script src="main.js"></script>
</body>

</html>
